<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan Neon Gradients -->
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050a10" stop-opacity="0.95" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield Base Background -->
  <polygon points="256,32 440,96 440,280 256,464 72,280 72,96" 
           fill="url(#shieldGrad)" stroke="#00e5ff" stroke-width="4" stroke-opacity="0.8" />

  <!-- Inner Cyber Grid Lines -->
  <polygon points="256,64 410,118 410,270 256,424 102,270 102,118" 
           fill="none" stroke="#00b4d8" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.4" />

  <!-- Holographic Concentric Rings -->
  <circle cx="256" cy="240" r="110" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.3" />
  <circle cx="256" cy="240" r="70" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="14,8" opacity="0.7" />

  <!-- Tactical Reticle Brackets -->
  <path d="M 180,200 L 180,180 L 200,180" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 332,200 L 332,180 L 312,180" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 180,280 L 180,300 L 200,300" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 332,280 L 332,300 L 312,300" fill="none" stroke="#00f0ff" stroke-width="3" />

  <!-- Cybernetic Hand Landmark Node Network -->
  <!-- Wrist -->
  <circle cx="256" cy="330" r="6" fill="#00f0ff" filter="url(#neonBlur)" />
  <!-- Knuckles -->
  <circle cx="210" cy="260" r="5" fill="#00b4d8" />
  <circle cx="240" cy="245" r="5" fill="#00b4d8" />
  <circle cx="272" cy="245" r="5" fill="#00b4d8" />
  <circle cx="302" cy="260" r="5" fill="#00b4d8" />
  <!-- Extended Index Controller Tip -->
  <circle cx="240" cy="155" r="8" fill="#ffffff" stroke="#00f0ff" stroke-width="3" filter="url(#neonBlur)" />
  <!-- Thumb Tip -->
  <circle cx="175" cy="230" r="6" fill="#00f0ff" />

  <!-- Connecting Neon Vectors -->
  <polyline points="256,330 210,260 175,230" fill="none" stroke="#00e5ff" stroke-width="2" />
  <polyline points="256,330 240,245 240,155" fill="none" stroke="#00f0ff" stroke-width="2.5" />
  <polyline points="256,330 272,245 272,200" fill="none" stroke="#00b4d8" stroke-width="1.8" />
  <polyline points="256,330 302,260 302,220" fill="none" stroke="#00b4d8" stroke-width="1.8" />

  <!-- Dynamic Gesture Pinch Arc -->
  <path d="M 175,230 C 190,180 220,165 240,155" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />

  <!-- Cybernetic Center Emblem C-Node -->
  <text x="256" y="405" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" 
        font-weight="900" font-size="28" fill="#00e5ff" letter-spacing="8">CRYNET</text>
  <text x="256" y="425" text-anchor="middle" font-family="'Consolas', monospace" 
        font-weight="600" font-size="10" fill="#64748b" letter-spacing="3">TACTICAL GESTURE SYSTEM</text>
</svg>
